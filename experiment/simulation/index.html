<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TLC Simulation</title>

<style>
body{
    font-family: "Times New Roman", serif;
    background:#eee;
}

.container{
    width:700px;
    margin:80px auto;
}

h1{
    margin-bottom:80px;
}

.row{
    display:flex;
    justify-content:space-between;
    margin-bottom:50px;
    font-size:20px;
}

.form-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

label{
    font-size:20px;
}

select,
input{
    width:250px;
    padding:6px;
    font-size:18px;
}

button{
    margin-left:380px;
    padding:8px 20px;
    font-size:18px;
    cursor:pointer;
}

.result-row{
    display:flex;
    justify-content:space-between;
    margin-top:60px;
    font-size:20px;
}

.note{
    margin-top:70px;
    font-size:22px;
}
</style>
</head>
<body>

<div class="container">

    <h1>Simulation</h1>

    <div class="row">
        <div>
            Stationary Phase:
            <strong>Silica gel</strong>
        </div>

        <div>
            Saturation time:
            <strong>15 minutes</strong>
        </div>
    </div>

    <div class="form-row">
        <label>Solvent System:</label>

        <select id="one">
            <option>None</option>
            <option>Toluene: Acetone:: 4:1</option>
            <option>Toluene: Acetone:: 2:1</option>
            <option>Toluene: Acetone:: 1:1</option>
            <option>Toluene: Acetone:: 6:1</option>
            <option>Toluene: Acetone:: 9:1</option>
        </select>
    </div>

    <button onclick="showRf()">Submit</button>

    <div class="result-row">

        <div>
            <strong>Optimum Rf: 0.13</strong>
        </div>

        <div>
            <strong>Simulation Rf:</strong><br><br>

            <input type="text" id="rfResult" readonly>
        </div>

    </div>

    <div class="note">
        RF VALUE IS DEPENDENT ON POLARITY OF SOLVENT SYSTEM
    </div>

</div>



</body>
</html>
